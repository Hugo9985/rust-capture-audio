[package]
name = "audio-router"
version = "1.2.0"
edition = "2024"
description = "Routeur audio faible latence (entrée vers sortie)"

[dependencies]
# "glow" (OpenGL) : plus léger que wgpu
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
# "realtime" : priorité temps réel pour les threads audio
cpal = { version = "0.18.2", features = ["realtime"] }
ringbuf = "0.4.8"

# Ramener la fenêtre existante au premier plan (instance unique)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Icône + métadonnées du .exe (Windows uniquement)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
ProductName = "Audio Router"
FileDescription = "Audio Router - routage audio faible latence"
LegalCopyright = ""

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false
incremental = false
